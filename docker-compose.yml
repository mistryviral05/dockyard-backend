services:
  postgres:
    image: postgres:16
    container_name: dockyard-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dockyard

    ports:
      - "5432:5432"

    volumes:
      - dockyard_data:/var/lib/postgresql/data

volumes:
  dockyard_data: