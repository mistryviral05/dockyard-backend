services:
  postgres:
    image: postgres:16
    container_name: dockyard-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dockyard

    ports:
      - "5433:5432"

    volumes:
      - dockyard_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: dockyard-redis
    ports:
      - "6380:6379"
    volumes:
      - dockyard_redis:/data
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-dockyardlocal}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dockyardlocal}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  dockyard_data:
  dockyard_redis: