name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  NAMESPACE: mistryviral05
  # The worker looks for dockyard/nixpacks:<this> on the host daemon.
  # Keep it in sync with nixpacksImage in internal/queue/constants.go.
  NIXPACKS_VERSION: 1.41.0

# Two deploys at the same time would fight over the same containers.
# cancel-in-progress stays false so a half finished deploy is never abandoned.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
          - name: worker
            dockerfile: Dockerfile.worker
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/dockyard-${{ matrix.name }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/dockyard-${{ matrix.name }}:latest
          # Without this cache every run downloads the whole module graph again.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # The agent image users pull onto their own servers. It is a public package,
  # so the install script can pull it without any credentials.
  agent:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent
          push: true
          build-args: |
            AGENT_VERSION=sha-${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/dockyard-agent:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/dockyard-agent:latest
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

  # The builder image the worker runs for every user build. It lives here so a
  # rebuilt VPS gets it from the deploy instead of somebody remembering to
  # build it by hand.
  nixpacks:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: build
          file: build/nixpacks.Dockerfile
          push: true
          build-args: |
            NIXPACKS_VERSION=${{ env.NIXPACKS_VERSION }}
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/dockyard-nixpacks:${{ env.NIXPACKS_VERSION }}
          cache-from: type=gha,scope=nixpacks
          cache-to: type=gha,mode=max,scope=nixpacks

  deploy:
    needs: [images, nixpacks]
    runs-on: ubuntu-latest
    permissions:
      # GITHUB_TOKEN is handed to the vps so it can pull the private images.
      # It dies with this run, so nothing long lived is left on the box.
      packages: read
    steps:
      - name: pull and restart on the vps
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Only the names listed here reach the remote shell.
          envs: GHCR_USER,GHCR_TOKEN
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ vars.DEPLOY_PATH || '/home/dockyard' }}"

            # The images are private, so the pulls below need a login first.
            # Never put the token on the command line: it would land in the
            # shell history and in ps output.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Log out even if a pull fails, so the credentials do not sit in
            # ~/.docker/config.json until the next deploy.
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            export IMAGE_TAG=sha-${{ github.sha }}

            # The worker calls docker run dockyard/nixpacks:<version> against
            # the host daemon, so the image has to carry that exact name.
            docker pull ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/dockyard-nixpacks:${{ env.NIXPACKS_VERSION }}
            docker tag ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/dockyard-nixpacks:${{ env.NIXPACKS_VERSION }} \
                       dockyard/nixpacks:${{ env.NIXPACKS_VERSION }}

            docker compose -f docker-compose.prod.yml pull api worker
            docker compose -f docker-compose.prod.yml up -d

            # Keep a week of images so a rollback to a recent sha still works.
            docker image prune -af --filter "until=168h"

            docker compose -f docker-compose.prod.yml ps
