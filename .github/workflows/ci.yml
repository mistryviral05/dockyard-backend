name: ci

on:
  # main is handled by cd.yml, which calls this workflow itself.
  # Without this filter every push to main would run the checks twice.
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Read the version from go.mod so there is only one place to bump it.
          go-version-file: go.mod
          cache: true

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...
